name: Build Release APK

# Builds a SIGNED release APK — the version you give to the public.
# Needs four repository Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     — the base64 text of your .jks keystore
#   KEYSTORE_PASSWORD   — the keystore password
#   KEY_ALIAS           — the key alias (cliqocheq)
#   KEY_PASSWORD        — the key password (same as keystore password unless you changed it)
# Run it from the Actions tab with "Run workflow", or it runs on a version tag push.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CliqoCheq-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
